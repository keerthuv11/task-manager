<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskFlow — Task Manager</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== Auth Screen ===== -->
  <section id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h1 class="brand">TaskFlow</h1>
      <p class="tagline">Organize your work, one task at a time.</p>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Log In</button>
        <button class="tab-btn" data-tab="register">Sign Up</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <p class="form-error" id="login-error"></p>
        <button type="submit" class="btn btn-primary">Log In</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label>Name
          <input type="text" name="name" required autocomplete="name" />
        </label>
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" name="password" required minlength="6" autocomplete="new-password" />
        </label>
        <p class="form-error" id="register-error"></p>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>
    </div>
  </section>

  <!-- ===== Dashboard ===== -->
  <section id="dashboard" class="dashboard hidden">
    <header class="topbar">
      <h1 class="brand">TaskFlow</h1>
      <div class="topbar-right">
        <span id="connection-dot" class="connection-dot" title="Real-time connection status"></span>
        <span id="user-name" class="user-name"></span>
        <button id="logout-btn" class="btn btn-ghost">Log Out</button>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <button id="new-task-btn" class="btn btn-primary">+ New Task</button>

        <div class="filters">
          <input id="search-input" type="search" placeholder="Search tasks…" />
          <select id="status-filter">
            <option value="">All statuses</option>
            <option value="todo">To Do</option>
            <option value="in-progress">In Progress</option>
            <option value="done">Done</option>
          </select>
          <select id="priority-filter">
            <option value="">All priorities</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>

      <p class="form-error" id="tasks-error"></p>

      <div id="board" class="board">
        <div class="column" data-status="todo">
          <h2>To Do <span class="count" id="count-todo">0</span></h2>
          <div class="task-list" id="list-todo"></div>
        </div>
        <div class="column" data-status="in-progress">
          <h2>In Progress <span class="count" id="count-in-progress">0</span></h2>
          <div class="task-list" id="list-in-progress"></div>
        </div>
        <div class="column" data-status="done">
          <h2>Done <span class="count" id="count-done">0</span></h2>
          <div class="task-list" id="list-done"></div>
        </div>
      </div>
    </main>
  </section>

  <!-- ===== Task Modal ===== -->
  <div id="task-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modal-title">New Task</h2>
      <form id="task-form">
        <input type="hidden" name="id" />
        <label>Title
          <input type="text" name="title" required maxlength="120" />
        </label>
        <label>Description
          <textarea name="description" rows="3" maxlength="500"></textarea>
        </label>
        <div class="form-row">
          <label>Status
            <select name="status">
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </label>
          <label>Priority
            <select name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>
        <label>Due Date
          <input type="date" name="dueDate" />
        </label>
        <p class="form-error" id="modal-error"></p>
        <div class="modal-actions">
          <button type="button" id="delete-task-btn" class="btn btn-danger hidden">Delete</button>
          <button type="button" id="cancel-modal-btn" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
